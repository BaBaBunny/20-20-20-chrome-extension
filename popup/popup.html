<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>20-20-20 Timer</title>
        <link rel="stylesheet" href="popup.css">
    </head>
    <body>
        <h2>20/20/20</h2>
        <h1 id="timer">20:00</h1>
        <p>Take a break every 20 minutes for 20 seconds.</p>
        <label for="volumeSlider">Volume: <span id="volumeValue">100%</span></label>
        <input id="volumeSlider" type="range" min="0" max="100" value="100">
        <button id="startButton">Start</button>
        <button id="resetButton">Reset</button>
        <button id="pauseButton" disabled>Pause</button>
        <script type="module" src="popup.js"></script>
    </body>
</html>
